<!--
  Reference scene fragment: "Inside a single cell", 6 shots, every picture built in code (SVG + GSAP).
  Copy the pattern, not the content. A fragment has three parts: <style>, the shot markup, and a <script>
  that adds animations to `tl` with the shell's helpers (shot, camera, reveal, label, bigNumber, credit).
  Storyboard it was written for:
    1 push_in   car on a dark road, the battery pack glowing in the floor
    2 push_in   the pack up close: rows of cells, one lights up
    3 push_in   that cell opens as a cutaway; graphite layers build on the left       (label: Anode)
    4 pan_left  round lithium-holding particles fill the right side                  (label: Cathode)
    5 static    liquid electrolyte fills the gap; lithium ions start to drift across  (label: Electrolyte)
    6 pull_out  a thin separator wall drops into the middle; pull back to the whole cell (label: Separator)
-->
<style>
  .sky { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 50% 35%, #13234a 0%, #0b1020 70%); }
  .glow { filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.65)); }
</style>

<!-- Shot 1: the car -->
<div class="shot" id="s1"><div class="cam">
  <div class="sky"></div>
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <rect x="0" y="760" width="1920" height="320" fill="#0d1530" />
    <rect x="0" y="752" width="1920" height="8" fill="#1e293b" />
    <path d="M430 690 C470 560 600 520 760 510 L900 420 C960 385 1060 380 1150 395 L1330 430 C1420 450 1490 520 1510 600 L1530 690 Z"
          fill="#1b2747" stroke="#334155" stroke-width="4" />
    <path d="M790 505 L915 440 C965 415 1040 412 1110 422 L1270 452 L1290 505 Z" fill="#0f1a35" stroke="#334155" stroke-width="3" />
    <circle cx="640" cy="700" r="70" fill="#0b1020" stroke="#475569" stroke-width="10" />
    <circle cx="1320" cy="700" r="70" fill="#0b1020" stroke="#475569" stroke-width="10" />
    <g id="pack1" class="glow">
      <rect x="720" y="640" width="520" height="46" rx="10" fill="#0f2a44" stroke="#38bdf8" stroke-width="3" />
    </g>
  </svg>
</div></div>

<!-- Shot 2: the pack up close -->
<div class="shot" id="s2"><div class="cam">
  <div class="sky"></div>
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" id="grid"></svg>
</div></div>

<!-- Shots 3-6: one cell, built up part by part -->
<div class="shot" id="s3"><div class="cam" id="cellcam">
  <div class="sky"></div>
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <rect x="300" y="170" width="1320" height="700" rx="48" fill="#0e1731" stroke="#38bdf8" stroke-width="5" class="glow" />
    <g id="anode"></g>
    <g id="cathode"></g>
    <rect id="electrolyte" x="330" y="200" width="1260" height="640" rx="30" fill="#38bdf8" opacity="0.13" />
    <g id="ions"></g>
    <g id="separator">
      <rect x="944" y="200" width="32" height="640" fill="#e2e8f0" opacity="0.85" />
      <rect x="944" y="200" width="32" height="640" fill="url(#holes)" />
    </g>
    <defs>
      <pattern id="holes" width="32" height="28" patternUnits="userSpaceOnUse">
        <circle cx="16" cy="14" r="5" fill="#0e1731" />
      </pattern>
    </defs>
  </svg>
</div></div>

<script>
  {
    const NS = "http://www.w3.org/2000/svg";
    const make = (tag, attrs, parent) => {
      const e = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
      parent.appendChild(e);
      return e;
    };

    // Shot 1: car; the pack pulses as the narration names it.
    shot(1, "#s1");
    tl.fromTo("#pack1", { opacity: 0.4 }, { opacity: 1, duration: 0.8, repeat: 3, yoyo: true, ease: "sine.inOut" }, shotStart(1) + 0.6);

    // Shot 2: a grid of cells; the middle one lights up.
    const grid = document.getElementById("grid"), cells = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 7; c++) {
      cells.push(make("rect", { x: 200 + c * 225, y: 190 + r * 180, width: 190, height: 140, rx: 22,
        fill: "#0f2a44", stroke: "#1e3a5f", "stroke-width": 4 }, grid));
    }
    const hero = cells[17];
    shot(2, "#s2");
    tl.fromTo(cells, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.02, ease: "power2.out" }, shotStart(2));
    tl.to(hero, { attr: { stroke: P[1], fill: "#123a5c" }, duration: 0.6 }, shotStart(2) + 1.5);

    // Shot 3: the cell, then graphite layers on the left (anode).
    shot(3, "#s3", { hold: true });
    const anode = document.getElementById("anode"), layers = [];
    for (let i = 0; i < 9; i++) layers.push(make("rect", { x: 360, y: 230 + i * 66, width: 540, height: 44, rx: 8, fill: "#475569" }, anode));
    tl.fromTo(layers, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, stagger: 0.12, ease: "power2.out" }, shotStart(3) + 0.6);
    label("Anode: usually graphite", 380, 110, shotStart(3) + 1.2, shotEnd(3));

    // Shot 4: round particles on the right (cathode).
    camera("#cellcam", S(4).camera, shotStart(4), shotLen(4));
    const cathode = document.getElementById("cathode"), dots = [];
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      dots.push(make("circle", { cx: 1050 + c * 62, cy: 250 + r * 66, r: 24, fill: P[2], opacity: 0.85 }, cathode));
    }
    tl.fromTo(dots, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, stagger: 0.01, ease: "back.out(2)" }, shotStart(4) + 0.3);
    label("Cathode", 1360, 110, shotStart(4) + 0.8, shotEnd(4));

    // Shot 5: electrolyte fills the gap; lithium ions drift from one side to the other.
    camera("#cellcam", S(5).camera, shotStart(5), shotLen(5));
    tl.fromTo("#electrolyte", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 1.4, ease: "power2.inOut" }, shotStart(5));
    const ions = document.getElementById("ions");
    for (let i = 0; i < 14; i++) {
      const ion = make("circle", { cx: 880, cy: 240 + i * 44, r: 9, fill: "#e0f2fe" }, ions);
      tl.fromTo(ion, { x: 0, opacity: 0 }, { x: 200, opacity: 1, duration: 2.6, ease: "sine.inOut", repeat: 1, yoyo: true },
        shotStart(5) + 1.0 + (i % 5) * 0.25);
    }
    label("Electrolyte", 830, 110, shotStart(5) + 0.6, shotEnd(5));

    // Shot 6: the separator drops in; pull back to the whole cell (the hero image).
    camera("#cellcam", S(6).camera, shotStart(6), shotLen(6));
    tl.fromTo("#separator", { y: -900 }, { y: 0, duration: 0.9, ease: "power3.out" }, shotStart(6) + 0.2);
    label("Separator", 860, 110, shotStart(6) + 0.8, shotEnd(6));
  }
</script>
