<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traversaal Video Studio</title>
<style>
  :root {
    --bg: #ffffff; --panel: #ffffff; --soft: #f4f7fb; --line: #e3e9f1; --fg: #1d2939; --muted: #6b7a90;
    --navy: #3b7dd8; --navy-soft: #eaf2fd; --amber: #3b7dd8; --amber-soft: #eaf2fd;
    --side: #f2f7fd; --side-line: #dfe9f6;
    --good: #2e7d5b; --good-soft: #e5f3ec; --bad: #b42318; --bad-soft: #fdecea;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.55 var(--font); }
  .app { display: grid; grid-template-columns: 210px minmax(0, 1fr) 320px; height: 100vh; }
  @media (max-width: 1150px) { .app { grid-template-columns: 200px minmax(0, 1fr); height: auto; } .facts { grid-column: 2; border-left: 0; border-top: 1px solid var(--line); max-height: none; } }
  @media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); } .facts, .side { grid-column: 1; } }
  button { font-family: var(--font); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* Left: brand, videos, setup */
  .side { background: var(--side); border-right: 1px solid var(--side-line); color: var(--fg); display: flex; flex-direction: column; min-height: 0; padding: 18px 14px; gap: 16px; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 0 4px; }
  .brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 800; }
  .brand b { display: block; color: var(--fg); font-size: 13.5px; }
  .brand small { color: var(--muted); font-size: 11px; }
  .newbtn { background: var(--panel); color: var(--navy); border: 1px solid var(--side-line); border-radius: 9px; padding: 8px; font-weight: 600; font-size: 12.5px; cursor: pointer; }
  .newbtn:hover { border-color: var(--navy); }
  .side h3 { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 4px 4px 0; font-weight: 600; }
  .runs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; overflow: auto; min-height: 0; flex: 1; }
  .run { text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 7px 9px; color: var(--fg); cursor: pointer; min-width: 0; }
  .run:hover { background: rgba(59,125,216,0.06); }
  .run.sel { background: var(--navy-soft); }
  .run .t { display: block; font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run .m { font-size: 11px; color: var(--muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #b6c2d3; }
  .dot.done { background: var(--good); } .dot.running { background: var(--navy); } .dot.failed, .dot.cancelled { background: var(--bad); }
  .setup { border-top: 1px solid var(--side-line); padding-top: 12px; font-size: 12px; }
  .setup button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 12px; }
  .setup .ok { color: var(--good); } .setup .no { color: var(--bad); }
  .checks { display: grid; gap: 6px; margin-top: 8px; font-size: 11.5px; color: var(--fg); }
  .checks .fix { color: var(--muted); overflow-wrap: anywhere; }

  /* Center */
  .main { overflow: auto; padding: 36px 40px; min-width: 0; }
  .newwrap { max-width: 640px; margin: 4vh auto 0; }
  .eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1 { font-size: 19px; margin: 6px 0 4px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: 0 1px 3px rgba(16,40,80,0.04); }
  .ask { font-size: 15px; min-height: 96px; }
  textarea, input[type=text], select { width: 100%; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 13.5px/1.5 var(--font); }
  textarea:focus, input[type=text]:focus, select:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px var(--navy-soft); }
  textarea { resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  @media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
  label.f { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 11.5px; color: var(--fg); cursor: pointer; }
  .chips button:hover { border-color: var(--navy); }
  .chips .morechips { background: none; border: 0; color: var(--navy); padding: 3px 4px; }
  details.moreset { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  details.moreset summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin-top: 12px; font-size: 12.5px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: 6px; }
  .seg button { border: 0; background: var(--panel); padding: 4px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--navy); color: #fff; }
  .tog { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .tog input { accent-color: var(--navy); width: 15px; height: 15px; }
  .locked { color: var(--good); }
  .go { margin-top: 20px; width: 100%; background: var(--navy); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .go:hover { background: #3170c7; }
  .go:disabled { opacity: 0.45; cursor: not-allowed; }
  .msg { color: var(--bad); font-size: 12px; margin-top: 8px; min-height: 1em; }

  .player { aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #eef3fa; display: grid; place-items: center; color: var(--muted); }
  .player video { width: 100%; height: 100%; display: block; background: #000; }
  .wait { width: 70%; text-align: center; }
  .wait b { color: var(--fg); font-size: 14px; }
  .bar { height: 6px; background: #dbe5f2; border-radius: 999px; overflow: hidden; margin: 14px 0 10px; }
  .bar i { display: block; height: 100%; background: var(--amber); border-radius: 999px; transition: width 0.4s; }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0 0; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 8px 13px; font-size: 12.5px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn.amber { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 600; }
  .notice { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; margin-top: 14px; }
  .steps { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; margin-top: 22px; }
  @media (max-width: 900px) { .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .step { border-top: 3px solid var(--line); padding-top: 7px; font-size: 11.5px; color: var(--muted); min-width: 0; }
  .step b { display: block; color: var(--fg); font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step.done { border-color: var(--good); } .step.now { border-color: var(--amber); }
  .step.now span { color: var(--navy); }
  .step a { color: var(--navy); }
  details.more { margin-top: 20px; }
  details.more summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .feed { background: var(--soft); border-radius: 10px; padding: 12px; max-height: 260px; overflow: auto; font-size: 12px; display: grid; gap: 5px; margin-top: 10px; }
  .feed .tool { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .feed .warn { color: var(--bad); font-family: var(--mono); font-size: 11px; }
  .doc { background: var(--soft); border-radius: 10px; padding: 14px; max-height: 460px; overflow: auto; white-space: pre-wrap; font: 12px/1.55 var(--mono); margin-top: 10px; }

  /* Right: fact trail */
  .facts { background: #fbfcfe; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; max-height: 100vh; }
  .facts header { padding: 20px 18px 12px; border-bottom: 1px solid var(--line); }
  .facts h2 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .stamp { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; color: var(--good); border: 1.5px solid var(--good); border-radius: 4px; padding: 1px 5px; transform: rotate(-3deg); }
  .counts { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .filters { display: flex; gap: 4px; margin-top: 10px; }
  .filters button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .filters button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .flist { overflow: auto; padding: 10px 12px 20px; display: grid; gap: 8px; align-content: start; flex: 1; min-height: 0; }
  .fact { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 12px; background: var(--panel); animation: pop 0.35s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
  .fact.verified { border-left: 3px solid var(--good); }
  .fact.found { border-left: 3px solid #b8c0cf; }
  .fact.rejected { border-left: 3px solid var(--bad); background: #fffafa; }
  .fact.rejected .claim { text-decoration: line-through; color: var(--muted); }
  .fact.current { box-shadow: 0 0 0 2px var(--amber); }
  .fact .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 4px; }
  .badge { font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 1px 6px; }
  .badge.verified { background: var(--good-soft); color: var(--good); }
  .badge.found { background: var(--soft); color: var(--muted); }
  .badge.rejected { background: var(--bad-soft); color: var(--bad); }
  .jump { border: 0; background: var(--navy-soft); color: var(--navy); border-radius: 5px; padding: 1px 7px; font: 600 11px var(--mono); cursor: pointer; }
  .fact .src { margin-top: 5px; font-size: 11.5px; }
  .fact .src a { color: var(--navy); text-decoration: none; }
  .fact .src a:hover { text-decoration: underline; }
  .fact .why { margin-top: 5px; color: var(--bad); font-size: 11.5px; }
  .fact .id { color: var(--muted); font: 10.5px var(--mono); }
  .empty { color: var(--muted); font-size: 12.5px; padding: 18px 6px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">T</div><div><b>Video Studio</b><small>Traversaal.ai</small></div></div>
    <button class="newbtn" id="newBtn" type="button">+ New video</button>
    <h3>Your videos</h3>
    <div class="runs" id="runs"></div>
    <div class="setup">
      <button type="button" id="setupBtn" aria-expanded="false"><span id="setupState">Checking setup…</span></button>
      <div id="setupBox" hidden>
        <div class="checks" id="checks"></div>
        <button type="button" id="refreshCheck" style="margin-top:8px;text-decoration:underline">Check again</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main"></main>

  <section class="facts" aria-label="Fact trail">
    <header>
      <h2>Fact trail <span class="stamp" id="stamp" hidden>VERIFIED</span></h2>
      <div class="counts" id="fcounts">Every fact in the film, with its source.</div>
      <div class="filters" id="filters" role="tablist">
        <button type="button" data-f="film" class="on">In the film</button>
        <button type="button" data-f="verified">All verified</button>
        <button type="button" data-f="rejected">Rejected</button>
      </div>
    </header>
    <div class="flist" id="flist"><div class="empty">Pick a video, or start a new one, to see its facts appear here.</div></div>
  </section>
</div>

<template id="newForm">
 <div class="newwrap">
  <div class="eyebrow">New video</div>
  <h1>What should the film explain?</h1>
  <p class="lede">One question in. Every fact is researched, checked against its source and shown on the right.</p>
  <div class="card">
    <label class="f" for="prompt">Your question or topic</label>
    <textarea id="prompt" class="ask" maxlength="400" placeholder="Why does opening a second checkout counter cut waiting time?"></textarea>
    <div class="hint"><span>A specific question makes a better story.</span><span id="count">0/400</span></div>
    <div class="chips" id="chips"></div>
    <div class="row2">
      <div><label class="f" for="audience">Who's watching?</label>
        <input type="text" id="audience" maxlength="120" placeholder="A general audience"></div>
      <div><label class="f" for="length">Length</label>
        <select id="length"><option value="2">2-minute demo · about 40 min to make</option><option value="7">7-minute film · about 1–1.5 hours</option></select></div>
    </div>
    <details class="moreset" open>
    <summary>More settings</summary>
    <div class="opts">
      <span>Look<span class="seg" id="look"><button type="button" data-v="auto" class="on">Auto</button><button type="button" data-v="light">Light</button><button type="button" data-v="night">Night</button></span></span>
      <label class="tog"><input type="checkbox" id="music" checked> Background music</label>
      <label class="tog"><input type="checkbox" id="draft"> Quick draft</label>
      <span class="locked">✓ Fact-check always on</span>
    </div>
    </details>
    <button class="go" id="go" type="button">Make the film →</button>
    <div class="msg" id="msg" role="status"></div>
  </div>
 </div>
</template>

<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => s == null ? "" : (s >= 3600 ? Math.floor(s / 3600) + "h " : "") + Math.floor((s % 3600) / 60) + "m " + String(Math.round(s % 60)).padStart(2, "0") + "s";
const clock = (s) => s == null ? "" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
let selected = null, lastRuns = [], docOpen = null, factFilter = "film", lastFacts = null, setupOk = false;

const CHIPS = ["How do electric vehicle batteries work?", "What caused the 2008 financial crisis?",
  "How does a vaccine teach the immune system?", "Tell the story of Snow White as the Brothers Grimm wrote it"];
// Plain-language names for the nine pipeline stages (same order as the server's STAGES).
const STEPS = ["Plan", "Research", "Fact-check", "Script", "Voice", "Shots", "Final check", "Animate", "Render"];
const NOW = ["Planning the story", "Gathering facts", "Checking every fact", "Writing the script", "Recording the voice",
  "Planning every shot", "Checking words and pictures", "Animating the scenes", "Putting it all together"];

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---------- setup ----------
async function loadChecks() {
  $("#setupState").textContent = "Checking setup…";
  try {
    const d = await api("/api/doctor");
    setupOk = d.ok;
    $("#checks").innerHTML = d.checks.map((c) => `<div><span class="${c.ok ? "ok" : "no"}">${c.ok ? "✓" : "✕"}</span> <b>${esc(c.name)}</b> ${esc(c.detail)}${c.fix ? `<div class="fix">${esc(c.fix)}</div>` : ""}</div>`).join("");
    $("#setupState").innerHTML = d.ok ? '<span class="ok">✓</span> Setup ready' : '<span class="no">!</span> Setup needed';
    if (!d.ok) { $("#setupBox").hidden = false; $("#setupBtn").setAttribute("aria-expanded", "true"); }
    const go = $("#go"); if (go) go.disabled = !d.ok;
  } catch (e) { $("#setupState").textContent = "Setup check failed"; }
}
$("#setupBtn").onclick = () => { const b = $("#setupBox"); b.hidden = !b.hidden; $("#setupBtn").setAttribute("aria-expanded", String(!b.hidden)); };
$("#refreshCheck").onclick = loadChecks;

// ---------- new video ----------
function showNew() {
  selected = null; docOpen = null; lastFacts = null;
  $("#main").innerHTML = ""; $("#main").appendChild($("#newForm").content.cloneNode(true));
  let look = "auto";
  const chips = (all) => (all ? CHIPS : CHIPS.slice(0, 2)).map((c) => `<button type="button">${esc(c)}</button>`).join("") +
    (all ? "" : `<button type="button" class="morechips">+${CHIPS.length - 2} more</button>`);
  $("#chips").innerHTML = chips(false);
  $("#chips").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.classList.contains("morechips")) { $("#chips").innerHTML = chips(true); return; }
    $("#prompt").value = b.textContent; count();
  };
  const count = () => { $("#count").textContent = `${$("#prompt").value.length}/400`; };
  $("#prompt").oninput = count;
  $("#look").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; look = b.dataset.v; $("#look").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
  $("#go").disabled = !setupOk;
  $("#go").onclick = async () => {
    const body = { prompt: $("#prompt").value.trim(), minutes: Number($("#length").value), audience: $("#audience").value.trim(),
                   look: look === "auto" ? null : look, music: $("#music").checked, draft: $("#draft").checked };
    $("#msg").textContent = ""; $("#go").disabled = true;
    try {
      const { slug } = await api("/api/runs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      selected = slug; factFilter = "all"; setFilterButtons(); await refresh(true);
    } catch (e) { $("#msg").textContent = e.message; $("#go").disabled = false; }
  };
  renderRuns(lastRuns); renderFacts(null);
  $("#prompt").focus();
}
$("#newBtn").onclick = showNew;

// ---------- video list ----------
function renderRuns(runs) {
  if (!runs.length) { $("#runs").innerHTML = '<div class="run"><span class="m">No videos yet.</span></div>'; return; }
  $("#runs").innerHTML = runs.map((r) => {
    const doneN = r.stages.filter((s) => s.done).length;
    const what = r.state === "done" ? "Ready" : r.state === "running" ? `Making · ${doneN}/9` : r.state === "failed" || r.state === "cancelled" ? `Stopped · ${doneN}/9` : `${doneN}/9 steps`;
    return `<button type="button" class="run ${r.slug === selected ? "sel" : ""}" data-slug="${esc(r.slug)}" title="${esc(r.title)}">
      <span class="t">${esc(r.title)}</span><span class="m"><span class="dot ${esc(r.state.replace(/\s+/g, "-"))}"></span>${what}${r.minutes ? " · " + r.minutes + " min" : ""}</span></button>`;
  }).join("");
}
$("#runs").addEventListener("click", (e) => {
  const b = e.target.closest(".run[data-slug]");
  if (b) { selected = b.dataset.slug; docOpen = null; lastFacts = null; factFilter = "film"; setFilterButtons(); refresh(true); }
});

// ---------- video detail ----------
async function openDoc(slug, file) {
  docOpen = file;
  const t = await (await fetch(`/files/${slug}/${file}`)).text();
  const box = $("#doc"); if (box) box.textContent = file.endsWith(".json") ? JSON.stringify(JSON.parse(t), null, 2) : t;
}

function renderDetail(d) {
  const doneN = d.stages.filter((s) => s.done).length;
  const stopped = d.state === "failed" || d.state === "cancelled";
  const now = d.stages.findIndex((s) => !s.done);
  const player = d.video ? `<video id="vid" controls preload="metadata" src="${d.video}"></video>` :
    `<div class="wait">${d.state === "running" ? `<b>${NOW[now] || "Working"}…</b><div class="bar"><i style="width:${Math.max(4, doneN / 9 * 100)}%"></i></div>
      <small>Step ${now + 1} of 9 · running for ${fmt(d.elapsed_s)} · facts appear on the right as they are found and checked. You can close this page.</small>` :
      stopped ? "This video stopped before it was finished." : "No video for this run."}</div>`;
  const o = d.options || {};
  const settings = [o.audience ? `For ${o.audience}` : null, o.look ? (o.look === "night" ? "Night look" : "Light look") : null,
    o.music === false ? "No music" : null, o.draft ? "Draft quality" : null].filter(Boolean).join(" · ");
  const res = d.result;
  const steps = d.stages.map((s, i) => `<div class="step ${s.done ? "done" : i === now && d.state === "running" ? "now" : ""}">
      <b>${STEPS[i]}</b><span>${s.done ? (s.detail ? esc(s.detail) : "Done") : i === now && d.state === "running" ? "Working…" : "—"}</span>
      ${s.done && s.file && s.file !== "final.mp4" ? `<br><a href="#" data-file="${esc(s.file)}">View</a>` : ""}</div>`).join("");
  const feed = (d.feed || []).slice().reverse().map((f) => `<div class="${f.kind}">${esc(f.text)}</div>`).join("") || '<span class="lede">No activity yet.</span>';
  $("#main").innerHTML = `
    <div class="eyebrow">${d.state === "done" ? "Ready to watch" : d.state === "running" ? `Making · ${Math.round(doneN / 9 * 100)}%` : stopped ? "Stopped" : "Earlier run"}</div>
    <h1>${esc(d.title)}</h1>
    <div class="meta">
      ${d.video_s ? `<span>${clock(d.video_s)} long</span>` : ""}${d.minutes ? `<span>Target ${d.minutes}:00</span>` : ""}
      ${d.video ? "<span>1920 × 1080</span>" : ""}${d.video_mb ? `<span>${d.video_mb >= 1000 ? (d.video_mb / 1000).toFixed(1) + " GB" : Math.round(d.video_mb) + " MB"}</span>` : ""}
      ${settings ? `<span>${esc(settings)}</span>` : ""}
    </div>
    <div class="player" style="margin-top:14px">${player}</div>
    <div class="actions">
      ${d.video ? `<a class="btn primary" href="${d.video}" download="${esc(d.slug)}.mp4">↓ Download MP4</a>` : ""}
      ${d.subtitles && d.video ? `<a class="btn" href="${d.subtitles}" download="${esc(d.slug)}.srt">Subtitles</a>` : ""}
      ${d.state === "running" ? `<button class="btn" id="cancel" type="button">Stop</button>` : ""}
      ${stopped ? `<button class="btn amber" id="resume" type="button">Continue this run</button>` : ""}
    </div>
    ${stopped ? `<div class="notice">${res && !res.ok ? esc(res.text.slice(0, 300)) + "<br>" : ""}Continue keeps the finished steps and picks up at the first unfinished one.</div>` : ""}
    <div class="steps">${steps}</div>
    <details class="more" ${docOpen ? "open" : ""}>
      <summary>${docOpen ? esc(docOpen) : "Activity log and files"} · folder runs/${esc(d.slug)}</summary>
      ${docOpen ? `<div class="doc" id="doc">Loading…</div><div class="actions"><a class="btn" href="#" id="closeDoc">Back to activity</a></div>` : `<div class="feed">${feed}</div>`}
    </details>`;
  $("#main").querySelectorAll("a[data-file]").forEach((a) => a.onclick = (e) => { e.preventDefault(); openDoc(d.slug, a.dataset.file); refresh(true); });
  if (docOpen) openDoc(d.slug, docOpen);
  const c = $("#closeDoc"); if (c) c.onclick = (e) => { e.preventDefault(); docOpen = null; refresh(true); };
  const x = $("#cancel"); if (x) x.onclick = async () => { await api(`/api/runs/${d.slug}/cancel`, { method: "POST" }); refresh(true); };
  const r = $("#resume"); if (r) r.onclick = async () => {
    r.disabled = true;
    try { await api(`/api/runs/${d.slug}/resume`, { method: "POST" }); } catch (e) { r.disabled = false; r.insertAdjacentHTML("afterend", `<span class="msg">${esc(e.message)}</span>`); }
    refresh(true);
  };
  const v = $("#vid"); if (v) v.addEventListener("timeupdate", () => markCurrent(v.currentTime));
}

// ---------- fact trail ----------
function setFilterButtons() { $("#filters").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.f === factFilter)); }
$("#filters").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; factFilter = b.dataset.f; setFilterButtons(); renderFacts(lastFacts); };

function renderFacts(data) {
  const box = $("#flist");
  if (!data) {
    $("#fcounts").textContent = "Every fact in the film, with its source."; $("#stamp").hidden = true;
    $("#filters").querySelector('[data-f="film"]').textContent = "In the film";
    box.innerHTML = '<div class="empty">Facts appear here as the researchers find them and the checkers verify or reject them.</div>';
    return;
  }
  const c = data.counts, rejectedSet = (f) => f.status !== "found" && f.status !== "verified";
  $("#fcounts").textContent = `${c.verified} verified · ${c.rejected} rejected${c.found ? ` · ${c.found} being checked` : ""}${c.in_film ? ` · ${c.in_film} shown in the film` : ""}`;
  $("#stamp").hidden = !c.verified;
  let list = data.facts;
  if (factFilter === "film") {
    list = list.filter((f) => f.at != null).sort((a, b) => a.at - b.at);
    if (!list.length) list = data.facts.slice().reverse();  // before the storyboard: everything, newest first
  } else if (factFilter === "verified") list = list.filter((f) => f.status === "verified");
  else if (factFilter === "rejected") list = list.filter(rejectedSet);
  else list = list.slice().reverse();
  if (!list.length) { box.innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
  box.innerHTML = list.map((f) => {
    const kind = f.status === "verified" ? "verified" : f.status === "found" ? "found" : "rejected";
    const badge = kind === "verified" ? "✓ Verified" : kind === "found" ? "Checking…" : "✗ " + f.status[0].toUpperCase() + f.status.slice(1);
    return `<div class="fact ${kind}" data-at="${f.at ?? ""}">
      <div class="top"><span class="badge ${kind}">${badge}</span>${f.at != null ? `<button class="jump" type="button" data-at="${f.at}" title="Play from here">▶ ${clock(f.at)}</button>` : `<span class="id">${esc(f.id)}</span>`}</div>
      <div class="claim">${esc(f.claim)}</div>
      ${f.reason ? `<div class="why">${esc(f.reason)}</div>` : ""}
      ${f.url ? `<div class="src"><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.source || f.url)} ↗</a></div>` : ""}
    </div>`;
  }).join("");
}
$("#flist").addEventListener("click", (e) => {
  const b = e.target.closest(".jump"); const v = $("#vid");
  if (b && v) { v.currentTime = Number(b.dataset.at); v.play(); }
});
let lastMark = -1;
function markCurrent(t) {
  const cards = [...$("#flist").querySelectorAll(".fact[data-at]")].filter((c) => c.dataset.at !== "");
  let cur = null; for (const c of cards) if (Number(c.dataset.at) <= t) cur = c;
  const idx = cur ? cards.indexOf(cur) : -1;
  if (idx === lastMark) return; lastMark = idx;
  cards.forEach((c) => c.classList.toggle("current", c === cur));
  if (cur) cur.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

// ---------- refresh ----------
let lastDetailKey = "", lastFactsKey = "";
async function refresh(force) {
  try {
    lastRuns = await api("/api/runs");
    renderRuns(lastRuns);
    if (!selected) return;
    const d = await api(`/api/runs/${selected}`);
    // Re-render only when something changed, so a playing video is never reset.
    const key = JSON.stringify([d.slug, d.state, d.stages, (d.feed || []).length, docOpen, d.video, d.state === "running" ? Math.floor((d.elapsed_s || 0) / 15) : 0]);
    if (force || key !== lastDetailKey) { lastDetailKey = key; renderDetail(d); }
    const f = await api(`/api/runs/${selected}/facts`);
    const fkey = JSON.stringify([selected, f.counts, f.facts.length, factFilter]);
    if (force || fkey !== lastFactsKey) { lastFactsKey = fkey; lastFacts = f; renderFacts(f); }
  } catch (e) { /* server restarting */ }
}

loadChecks();
api("/api/runs").then((runs) => { lastRuns = runs; const first = runs.find((r) => r.state === "running"); if (first) { selected = first.slug; refresh(true); } else showNew(); }).catch(showNew);
setInterval(() => { if (lastRuns.some((r) => r.state === "running")) refresh(); }, 4000);
</script>
</body>
