<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1020; }
      #root { width: 100%; height: 100%; }
      #card {
        width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #title { color: #f4f4f5; font-size: 96px; font-weight: 700; letter-spacing: -0.03em; }
      #subtitle { color: #94a3b8; font-size: 40px; }
      #bar { width: 900px; height: 14px; border-radius: 7px; background: #38bdf8; transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <h1 id="title">Prompt → Video</h1>
        <div id="bar"></div>
        <p id="subtitle">HyperFrames test clip · Traversaal.ai capstone</p>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.inOut" }, 0.8);
      tl.fromTo("#subtitle", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.6);
      tl.to(["#title", "#bar", "#subtitle"], { opacity: 0, duration: 0.5 }, 5.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
