<!--
  Scene 2 "Into the Forest" (Snow White as the Brothers Grimm wrote it). Layered paper-cut storybook.
    1 pull_out  the gold mirror: the queen's reflection gives way to the girl; the queen's shadow recoils, rim turns green
    2 pan_left  throne room: the queen points, the huntsman bows, forest slides in, he leads the girl toward it
    3 parallax  paper forest: his raised arm lowers, the girl runs off, a young boar trots out
    4 push_in   candlelit castle: the lidded box handed over, steaming covered bowl, the queen's long shadow, faint mirror
    5 parallax  dusk: the girl runs through thorns and stones toward a far gold cottage window
    6 pull_out  the cottage pops up: seven beds, seven lantern-bearers, door shuts and the bolt slides   (label: Let no one in)
-->
<style>
  .bg { position: absolute; inset: 0; }
  .ps { filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.55)); }
  .ps2 { filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.45)); }
  .gold-glow { filter: drop-shadow(0 0 22px rgba(201, 164, 76, 0.85)); }
  .cream-glow { filter: drop-shadow(0 0 18px rgba(242, 234, 216, 0.7)); }
  .green-glow { filter: drop-shadow(0 0 20px rgba(150, 175, 60, 0.9)); }
  .wide { margin-left: -120px; }
</style>

<!-- Shot 1: the mirror -->
<div class="shot" id="s1"><div class="cam">
  <div class="bg" style="background: radial-gradient(900px 760px at 50% 45%, #3b2f2b 0%, #1c1828 55%, #0c0a14 100%);"></div>
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <radialGradient id="glass1" cx="50%" cy="42%" r="62%">
        <stop offset="0" stop-color="#4a4166" /><stop offset="0.6" stop-color="#241f36" /><stop offset="1" stop-color="#100e19" />
      </radialGradient>
      <radialGradient id="girlGlow1" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#F2EAD8" stop-opacity="0.55" /><stop offset="1" stop-color="#F2EAD8" stop-opacity="0" />
      </radialGradient>
      <clipPath id="clip1"><ellipse cx="960" cy="490" rx="350" ry="440" /></clipPath>
    </defs>
    <!-- paper wall layers behind the mirror -->
    <g class="ps"><ellipse cx="960" cy="490" rx="560" ry="620" fill="#241e30" /></g>
    <g class="ps"><ellipse cx="960" cy="490" rx="470" ry="560" fill="#2c2539" /></g>
    <g id="leaves1" class="ps2"></g>
    <g id="rimdots1" class="gold-glow"></g>
    <ellipse cx="960" cy="490" rx="350" ry="440" fill="url(#glass1)" />
    <g clip-path="url(#clip1)">
      <g id="ripples1"></g>
      <g transform="translate(960,935) scale(1.6)"><g id="q1"></g></g>
      <ellipse id="gglow1" cx="960" cy="620" rx="280" ry="360" fill="url(#girlGlow1)" opacity="0" />
      <g transform="translate(960,915) scale(2.3)"><g id="g1" class="cream-glow"></g></g>
      <g id="motes1"></g>
    </g>
    <g class="gold-glow"><ellipse cx="960" cy="490" rx="366" ry="456" fill="none" stroke="#C9A44C" stroke-width="30" /></g>
    <ellipse id="green1" cx="960" cy="490" rx="376" ry="466" fill="none" stroke="#8fa13c" stroke-width="16" opacity="0" class="green-glow" />
    <ellipse cx="960" cy="490" rx="336" ry="426" fill="none" stroke="#F2EAD8" stroke-width="3" opacity="0.45" />
    <g transform="translate(250,1190) scale(2.5)"><g id="qs1"></g></g>
  </svg>
</div></div>

<!-- Shot 6: the cottage pops up -->
<div class="shot" id="s6"><div class="cam">
  <div class="bg" style="background: radial-gradient(1100px 700px at 50% 55%, #3a3350 0%, #1b1828 60%, #0e0c16 100%);"></div>
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <radialGradient id="lamp6" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#C9A44C" stop-opacity="0.45" /><stop offset="1" stop-color="#C9A44C" stop-opacity="0" />
      </radialGradient>
    </defs>
    <!-- the open page the cottage rises from -->
    <g class="ps"><path d="M120,880 L1800,880 L1880,1080 L40,1080 Z" fill="#F2EAD8" /><path d="M958,880 L962,880 L966,1080 L954,1080 Z" fill="#b9ad95" /></g>
    <g id="cottage6">
      <g class="ps">
        <rect x="380" y="300" width="1160" height="582" fill="#e8dcc2" />
        <path d="M330,312 L960,120 L1590,312 Z" fill="#B3202E" />
        <rect x="1300" y="150" width="60" height="110" fill="#8e1a25" />
      </g>
      <rect x="420" y="336" width="960" height="530" fill="#2b2230" />
      <ellipse cx="900" cy="700" rx="520" ry="260" fill="url(#lamp6)" />
      <g id="beds6"></g>
      <rect x="420" y="846" width="960" height="20" fill="#3d2f2a" />
      <!-- doorway on the right wall -->
      <rect x="1410" y="590" width="104" height="276" fill="#14121F" />
      <g transform="translate(1410,590)"><g id="door6">
        <rect x="0" y="0" width="104" height="276" fill="#6b4a32" stroke="#4a3426" stroke-width="5" />
        <rect x="14" y="20" width="76" height="100" fill="none" stroke="#4a3426" stroke-width="4" />
        <rect x="14" y="150" width="76" height="100" fill="none" stroke="#4a3426" stroke-width="4" />
      </g></g>
      <g transform="translate(1398,712)"><g id="bolt6">
        <rect x="0" y="0" width="128" height="18" rx="4" fill="#C9A44C" /><rect x="96" y="-10" width="14" height="38" rx="3" fill="#a8873a" />
      </g></g>
      <g transform="translate(900,866) scale(1.15)" class="cream-glow"><g id="girl6"></g></g>
      <g id="dwarfs6"></g>
    </g>
    <g id="motes6" class="gold-glow"></g>
  </svg>
</div></div>

<script>
  {
    const $id = (id) => document.getElementById(id);
    const put = (id, html) => { $id(id).innerHTML = html; };
    const rnd = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

    // ---- paper-cut figures, feet at (0,0), facing right ----
    const queen = (f) => `<g fill="${f}">
      <polygon points="-22,-352 -22,-380 -11,-366 0,-390 11,-366 22,-380 22,-352" />
      <circle cx="0" cy="-326" r="27" />
      <path d="M-66,-350 L-26,-292 L26,-292 L66,-350 L48,-276 L-48,-276 Z" />
      <rect x="-10" y="-304" width="20" height="18" />
      <path d="M-34,-290 L34,-290 L46,-190 L118,0 L-118,0 L-46,-190 Z" /></g>`;
    const girl = (f, legs) => `<g>
      <circle cx="0" cy="-176" r="20" fill="${f}" />
      <path d="M-21,-180 A21 21 0 0 1 21,-180 L22,-162 Q18,-176 0,-182 Q-18,-176 -22,-162 Z" fill="#14121F" />
      <path d="M-2,-197 L-26,-212 L-24,-186 Z M2,-197 L26,-212 L24,-186 Z" fill="#B3202E" />
      <rect x="-7" y="-158" width="14" height="10" fill="${f}" />
      ${legs ? `<g id="${legs}a"><rect x="-14" y="-52" width="10" height="52" rx="4" fill="${f}" /></g>
                <g id="${legs}b"><rect x="4" y="-52" width="10" height="52" rx="4" fill="${f}" /></g>
                <path d="M-16,-152 L16,-152 L22,-110 L44,-46 L-44,-46 L-22,-110 Z" fill="${f}" />`
             : `<path d="M-16,-152 L16,-152 L22,-100 L58,0 L-58,0 L-22,-100 Z" fill="${f}" />`}</g>`;
    const hunter = (f) => `<g fill="${f}">
      <path d="M-52,-312 Q-112,-212 -52,-112" fill="none" stroke="${f}" stroke-width="7" />
      <line x1="-52" y1="-312" x2="-52" y2="-112" stroke="${f}" stroke-width="2" />
      <path d="M-30,-342 Q0,-380 32,-342 Z" /><path d="M14,-366 Q46,-406 66,-392 Q38,-378 20,-356 Z" />
      <circle cx="0" cy="-320" r="24" />
      <path d="M-40,-294 L40,-294 L54,-128 L-54,-128 Z" />
      <rect x="-36" y="-130" width="24" height="130" rx="6" /><rect x="12" y="-130" width="24" height="130" rx="6" /></g>`;
    const dwarf = (f) => `<g fill="${f}">
      <path d="M-20,-100 L2,-156 L24,-100 Z" fill="#B3202E" />
      <circle cx="0" cy="-88" r="16" />
      <path d="M-14,-84 Q2,-44 16,-84 Z" fill="#d9cdb3" />
      <path d="M-26,-72 L26,-72 L32,0 L-32,0 Z" /></g>`;
    const boar = (f) => `<g fill="${f}">
      <path d="M-92,-34 Q-98,-84 -40,-94 L24,-96 Q74,-92 88,-62 L126,-52 L124,-34 L84,-30 Q62,-20 40,-20 L-62,-20 Z" />
      <path d="M-70,-88 L-58,-108 L-48,-92 L-34,-112 L-22,-95 L-8,-114 L6,-96 L20,-112 L30,-94 Z" />
      <path d="M52,-84 L62,-112 L74,-80 Z" />
      <path d="M112,-38 Q122,-30 116,-20" fill="none" stroke="#F2EAD8" stroke-width="4" />
      <rect x="-70" y="-26" width="14" height="26" rx="4" /><rect x="-40" y="-26" width="14" height="26" rx="4" />
      <rect x="30" y="-26" width="14" height="26" rx="4" /><rect x="58" y="-26" width="14" height="26" rx="4" /></g>`;
    const pine = (x, base, h, f) => {
      let s = `<rect x="${x - h * 0.03}" y="${base - h * 0.2}" width="${h * 0.06}" height="${h * 0.2}" fill="${f}" />`;
      for (let i = 0; i < 3; i++) {
        const top = base - h + i * h * 0.24, bot = top + h * 0.46, w = h * (0.16 + 0.07 * i);
        s += `<polygon points="${x},${top} ${x + w},${bot} ${x - w},${bot}" fill="${f}" />`;
      }
      return s;
    };
    const branch = (x0, y0, len, dir, f) => {
      let s = `<path d="M${x0},${y0} q${len * 0.5},${-40 * dir} ${len},${10 * dir}" fill="none" stroke="${f}" stroke-width="14" stroke-linecap="round" />`;
      for (let k = 1; k < 9; k++) { const x = x0 + (len * k) / 9, y = y0 - 22 * dir * Math.sin((k / 9) * Math.PI);
        s += `<polygon points="${x - 8},${y} ${x + 8},${y} ${x + 2},${y - 34 * dir * (k % 2 ? 1 : -1)}" fill="${f}" />`; }
      return s;
    };

    // =================== Shot 1: the mirror ===================
    put("q1", queen("#0c0a14"));
    put("g1", girl("#F2EAD8"));
    put("qs1", queen("#07060b"));
    let dots = "", leaves = "";
    for (let i = 0; i < 40; i++) {
      const a = (i / 40) * Math.PI * 2;
      dots += `<circle cx="${960 + Math.cos(a) * 392}" cy="${490 + Math.sin(a) * 482}" r="${i % 2 ? 7 : 11}" fill="#C9A44C" />`;
    }
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2, cx = 960 + Math.cos(a) * 430, cy = 490 + Math.sin(a) * 522, deg = (a * 180) / Math.PI + 90;
      leaves += `<ellipse cx="${cx}" cy="${cy}" rx="18" ry="44" fill="#3a3148" transform="rotate(${deg} ${cx} ${cy})" />`;
    }
    put("rimdots1", dots); put("leaves1", leaves);
    let rip = "";
    for (let i = 0; i < 5; i++) rip += `<ellipse class="rip1" cx="960" cy="520" rx="${80 + i * 60}" ry="${30 + i * 22}" fill="none" stroke="#F2EAD8" stroke-width="2" opacity="0.18" />`;
    put("ripples1", rip);
    let motes = "";
    for (let i = 0; i < 18; i++) motes += `<circle class="mote1" cx="${700 + rnd(i) * 520}" cy="${180 + rnd(i + 50) * 640}" r="${2 + rnd(i + 9) * 4}" fill="#C9A44C" opacity="0.6" />`;
    put("motes1", motes);

    shot(1, "#s1");
    const a1 = shotStart(1);
    tl.fromTo(".rip1", { scale: 0.7, transformOrigin: "50% 50%", opacity: 0 },
      { scale: 1.25, opacity: 0.22, duration: 2.2, stagger: 0.25, ease: "sine.out", repeat: 1, yoyo: true }, a1);
    tl.to("#q1", { opacity: 0, duration: 1.2, ease: "power1.in" }, a1 + 1.4);
    tl.fromTo("#g1", { opacity: 0, scale: 0.9, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, a1 + 1.9);
    tl.to("#gglow1", { opacity: 1, duration: 1.2 }, a1 + 2.0);
    tl.to("#qs1", { x: -110, y: 30, rotate: -6, transformOrigin: "50% 100%", duration: 0.8, ease: "power3.out" }, a1 + 2.6);
    tl.to("#green1", { opacity: 0.9, duration: 1.0, ease: "power1.inOut" }, a1 + 2.8);
    tl.fromTo(".mote1", { y: 0 }, { y: -90, duration: shotLen(1), stagger: 0.05, ease: "none" }, a1);

    // =================== Shot 2: throne room ===================
    let arches = "";
    for (let i = 0; i < 6; i++) {
      const x = 40 + i * 330;
      arches += `<path d="M${x},780 L${x},360 A90 90 0 0 1 ${x + 180},360 L${x + 180},780 Z" fill="#30293f" />
                 <path d="M${x + 30},760 L${x + 30},380 A60 60 0 0 1 ${x + 150},380 L${x + 150},760 Z" fill="#3c3552" />`;
    }
    put("arches2", arches);
    let banners = "";
    for (let i = 0; i < 6; i++) { const x = 250 + i * 330; banners += `<path d="M${x},120 L${x + 60},120 L${x + 60},420 L${x + 30},390 L${x},420 Z" fill="#B3202E" />`; }
    put("banners2", banners);
    let trees2 = "";
    for (let i = 0; i < 7; i++) trees2 += pine(1450 + i * 95 + (i % 2) * 30, 840, 420 + (i % 3) * 110, i % 2 ? "#2E5E4E" : "#244b3f");
    put("trees2", trees2);
    put("queen2", queen("#0b0a12"));
    put("girl2", girl("#F2EAD8"));
    put("huntbow2", hunter("#0b0a12"));

    shot(2, "#s2");
    const a2 = shotStart(2);
    tl.set("#huntflip2", { scaleX: -1, transformOrigin: "50% 100%" }, 0);
    tl.fromTo("#arm2", { rotate: 70, transformOrigin: "0% 50%" }, { rotate: -6, duration: 0.9, ease: "power2.out" }, a2 + 0.3);
    tl.to("#huntbow2", { rotate: -22, transformOrigin: "50% 100%", duration: 0.8, ease: "power2.inOut" }, a2 + 0.9);
    tl.to("#huntbow2", { rotate: 0, duration: 0.6, ease: "power2.inOut" }, a2 + 2.2);
    tl.fromTo("#trees2", { x: 760 }, { x: 0, duration: 1.8, ease: "power3.out" }, lineStart(1) + 2.4);
    tl.fromTo("#curl2p", { scale: 0.2, transformOrigin: "100% 0%" }, { scale: 1.3, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, a2 + 1.0);
    tl.to("#huntflip2", { scaleX: 1, duration: 0.3 }, a2 + 3.0);
